# ==============================================================
# Stack cơ sở — dùng chung cho mọi môi trường.
# Dev :  docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ==============================================================

name: create-video-vo3

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  TZ: ${TZ:-Asia/Ho_Chi_Minh}

services:
  # ---------------------------------------------------------- DB
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vo3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vo3}
      POSTGRES_DB: ${POSTGRES_DB:-vo3}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vo3} -d ${POSTGRES_DB:-vo3}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [vo3net]

  # ------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./infra/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [vo3net]

  # ----------------------------------------------------- Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *common-env
      SERVICE_NAME: backend
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - video_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [vo3net]

  # ------------------------------------------- Celery worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "--concurrency=4", "-Q", "video,default"]
    env_file: [.env]
    environment:
      <<: *common-env
      SERVICE_NAME: worker
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - video_storage:/app/storage
    healthcheck:
      test: ["CMD", "celery", "-A", "app.workers.celery_app", "inspect", "ping", "-d", "celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [vo3net]

  # ------------------------------------------- Celery beat (cron)
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]
    env_file: [.env]
    environment:
      <<: *common-env
      SERVICE_NAME: beat
    depends_on:
      redis: {condition: service_healthy}
    networks: [vo3net]

  # -------------------------------------------------- AI service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      <<: *common-env
      SERVICE_NAME: ai-service
    depends_on:
      redis: {condition: service_healthy}
    volumes:
      - video_storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [vo3net]

  # ---------------------------------------------------- Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Create Video VO3}
    restart: unless-stopped
    environment:
      <<: *common-env
      NODE_ENV: production
    depends_on: [backend]
    networks: [vo3net]

  # ------------------------------------------- Nginx reverse proxy
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - video_storage:/var/www/storage:ro
    depends_on: [backend, frontend]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [vo3net]

volumes:
  postgres_data:
  redis_data:
  video_storage:

networks:
  vo3net:
    driver: bridge
