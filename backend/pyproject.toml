# ==============================================================
# Backend — cấu hình tooling (ruff / mypy / pytest / coverage).
# Dependencies khai báo ở requirements.txt, file này chỉ cấu hình công cụ.
# ==============================================================

[project]
name = "vo3-backend"
version = "0.1.0"
description = "API tạo video bằng AI (Veo 3 / Seedance 1.5)"
requires-python = ">=3.11"

# ----------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]
exclude = [".venv", "alembic/versions", "__pycache__"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "C4",        # comprehensions
    "UP",        # pyupgrade
    "ASYNC",     # lỗi async phổ biến (rất quan trọng vì code toàn async)
    "S",         # bandit — bảo mật
    "T20",       # cấm print()
    "SIM",       # simplify
    "RUF",
]
ignore = [
    "E501",      # độ dài dòng đã do formatter lo
    "B008",      # Depends() trong default argument là idiom của FastAPI
    "S101",      # assert — cần cho pytest
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"alembic/**" = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions/", ".venv/"]

[[tool.mypy.overrides]]
module = ["tests.*", "alembic.*"]
disallow_untyped_defs = false

# --------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
markers = [
    "unit: test không cần I/O ngoài",
    "integration: test cần Postgres/Redis thật",
    "slow: test chậm (gọi provider video)",
]

# ------------------------------------------------------- coverage
[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
