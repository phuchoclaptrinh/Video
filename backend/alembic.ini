# ==============================================================
# Alembic — cấu hình migration.
# sqlalchemy.url để TRỐNG có chủ đích: env.py đọc DATABASE_URL_SYNC từ .env,
# tránh việc hardcode mật khẩu DB vào file được commit.
#
#   alembic revision --autogenerate -m "create video_jobs"
#   alembic upgrade head
#   alembic downgrade -1
# ==============================================================

[alembic]
script_location = alembic
prepend_sys_path = .

# Tên file migration: 2026_08_21_1430-abc123_create_video_jobs.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

timezone = Asia/Ho_Chi_Minh
truncate_slug_length = 40
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]
# Tự format file migration vừa sinh ra
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# ------------------------------------------------------- logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
