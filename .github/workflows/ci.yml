name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------ backend
  backend:
    name: Backend — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vo3
          POSTGRES_PASSWORD: vo3
          POSTGRES_DB: vo3_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vo3"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Cài dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Kiểm tra migration khớp với model
        # Nếu autogenerate còn sinh ra thay đổi => có model chưa được migrate
        env:
          DATABASE_URL_SYNC: postgresql+psycopg://vo3:vo3@localhost:5432/vo3_test
        run: |
          alembic upgrade head
          alembic check

      - name: Chạy test
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://vo3:vo3@localhost:5432/vo3_test
          DATABASE_URL_SYNC: postgresql+psycopg://vo3:vo3@localhost:5432/vo3_test
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://localhost:6379/1
          CELERY_RESULT_BACKEND: redis://localhost:6379/2
          SECRET_KEY: ci_secret_key_khong_dung_that
          # Không có key thật trong CI -> test phải mock provider (dùng respx)
          GOOGLE_API_KEY: ""
          SEEDANCE_API_KEY: ""
        run: pytest -m "not slow"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # --------------------------------------------------- ai-service
  ai-service:
    name: AI service — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Cài dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov respx

      - name: Chạy test
        env:
          ENVIRONMENT: test
          GOOGLE_API_KEY: ""
          SEEDANCE_API_KEY: ""
        # Bỏ qua test gọi provider thật (tốn tiền)
        run: pytest -m "not provider"

  # ----------------------------------------------------- frontend
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ------------------------------------------------ build docker
  docker-build:
    name: Docker — thử build image
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend]
    strategy:
      fail-fast: false
      matrix:
        service: [backend, ai-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} (không push)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: production
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
