# ==============================================================
# Server block — định tuyến vào các service.
#
#   /              -> frontend (Next.js)
#   /api/          -> backend (FastAPI)
#   /api/v1/chat   -> backend, TẮT buffering để SSE stream được realtime
#   /storage/      -> file video/thumbnail, nginx serve trực tiếp
#
# ai-service KHÔNG expose ra ngoài — chỉ backend gọi qua mạng nội bộ.
# ==============================================================

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    limit_conn conn_limit 20;

    # Health check của chính nginx (dùng cho load balancer)
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ------------------------------------------- SSE: tiến trình gen video
    # Phải đặt TRƯỚC location /api/ vì nginx ưu tiên prefix dài hơn.
    location ~ ^/api/v1/(chat|video)/.*/stream$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # 3 dòng dưới là bắt buộc, thiếu là SSE bị nghẽn trong buffer
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # giữ kết nối suốt thời gian job chạy
        chunked_transfer_encoding off;
    }

    # ------------------------------------- endpoint tạo video (siết rate)
    location /api/v1/video/generate {
        limit_req zone=gen_limit burst=5 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------- API chung
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Reference/keyframe image preparation can take several minutes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    #Swagger UI / OpenAPI
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------ video & thumbnail tĩnh
    location /storage/ {
        alias /var/www/storage/;

        # Cho phép tua video (seek) trong trình phát
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;

        # Không cho liệt kê thư mục
        autoindex off;
        # File video đã có tên ngẫu nhiên; nếu cần bảo mật hơn thì chuyển
        # sang signed URL do backend cấp thay vì serve trực tiếp ở đây.
        try_files $uri =404;
    }

    # ------------------------------------- asset build sẵn của Next.js
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---------------------------------------------------- frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

