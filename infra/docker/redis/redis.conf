# ==============================================================
# Redis — vừa làm broker Celery vừa làm cache.
# Broker cần độ bền (mất message = mất job gen video đã tính tiền),
# nên bật AOF thay vì chỉ dựa vào RDB snapshot.
# ==============================================================

# ---------------------------------------------------- network
bind 0.0.0.0
protected-mode no          # chỉ mở trong docker network nội bộ, không expose ra ngoài
port 6379
tcp-backlog 511
tcp-keepalive 300
timeout 0

# ----------------------------------------------------- chung
daemonize no               # docker quản lý tiến trình, không tự fork
loglevel notice
databases 16
# db0 = cache | db1 = celery broker | db2 = celery result

# ------------------------------------------- bền vững dữ liệu
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec       # cân bằng: mất tối đa 1 giây dữ liệu khi crash
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB snapshot dự phòng
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ------------------------------------------------- bộ nhớ
maxmemory 512mb
# volatile-lru: chỉ xoá key CÓ TTL khi đầy bộ nhớ.
# KHÔNG dùng allkeys-lru vì sẽ xoá cả message trong queue Celery.
maxmemory-policy volatile-lru
maxmemory-samples 5

# --------------------------------------------- chậm / cảnh báo
slowlog-log-slower-than 10000    # ghi lại lệnh chậm hơn 10ms
slowlog-max-len 128

# ------------------------------------------------- an toàn
# Chặn lệnh nguy hiểm bị gọi nhầm trong production
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""

# Production nên bật mật khẩu, đồng thời cập nhật REDIS_URL trong .env
# thành redis://:<password>@redis:6379/0
# requirepass thay_bang_mat_khau_manh
